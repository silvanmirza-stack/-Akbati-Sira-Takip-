
name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project if needed
        run: |
          set -e
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            ZIP=$(find . -maxdepth 3 -name "Akbati-Sira-Takip-Proje.zip" -print -quit)
            if [ -z "$ZIP" ]; then
              echo "Project ZIP not found"
              exit 1
            fi
            mkdir -p extracted-project
            unzip -o "$ZIP" -d extracted-project
          fi

      - name: Build APK
        run: |
          set -e
          FILE=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' -print -quit)
          if [ -z "$FILE" ]; then
            echo "No Gradle build files found"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          cd "$DIR"
          gradle --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/output/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Akbati-Sira-Takip-APK
          path: output/app-debug.apk

          
